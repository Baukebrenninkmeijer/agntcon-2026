name: Offline CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANALYTICS_CHATBOT_LIVE_TEST: "0"
      ORQ_API_KEY: ""
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.13.2"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install Python
        run: uv python install 3.13.2

      - name: Install locked dependencies
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Run offline tests
        run: uv run --no-sync pytest -m "not live and not simulation_live and not alignment_live" -q

      - name: Validate Orq resource YAML offline when available
        shell: bash
        run: |
          if [[ -f src/analytics_chatbot/orq_resources.py && -d orq/resources ]]; then
            uv run --no-sync python -c \
              'from pathlib import Path; from analytics_chatbot.orq_resources import load_resource_bundle; load_resource_bundle(Path("orq/resources"))'
          else
            echo "::notice::Orq resource YAML validator is not present in this revision; skipping its offline hook."
          fi

      - name: Build package
        run: uv build --out-dir "${RUNNER_TEMP}/dist"
