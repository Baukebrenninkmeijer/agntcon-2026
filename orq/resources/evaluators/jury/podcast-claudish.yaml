kind: evaluator
type: llm_eval
key: podcast-claudish
display_name: Podcast claudish
description: >-
  Judges whether a delivered podcast script reads as machine-written to a careful listener.
  Written for the talk's inter-judge agreement run: the same rubric is scored by three models,
  one of which generated the scripts. This draft is not aligned against human labels.
path: evaluators/jury
# Single judge on purpose: the agreement measurement compares three separate evaluator runs,
# one per model, rather than pooling them into one jury verdict.
mode: single
model: google/gemini-3.6-flash
judges:
  - google/gemini-3.6-flash
  - wafer/DeepSeek-V4-Flash-0731-Fast
  - tensorix/qwen/qwen3.8-flash-next
min_successful_judges: 1
repetitions: 1
output:
  type: categorical
  labels:
    - {value: pass, description: Reads as something a person wrote or said.}
    - {value: fail, description: A careful listener would recognise it as machine-written.}
  passing: [pass]
input_mapping:
  input.user_query: the source digest the episode was written from
  output.response: the delivered script
validation:
  status: pending_human_labels
  human_labeled_examples: 0
prompt: |
  You are judging a script written to be spoken aloud as a short two-host podcast episode
  about AI news. It was generated by a language model from a written digest.

  <task>
  Decide whether a careful listener who uses language models daily would recognise this script
  as machine-written. You have no reference episode and none exists. Judge the writing itself.
  </task>

  <what_counts>
  Machine-written tells include, but are not limited to:
  - Vocabulary that signals generated prose rather than speech.
  - Structural habits: reframing by negation, asking a question and immediately answering it,
    stacking three adjectives, inflating ordinary news into world-historical stakes, coining a
    label for a concept and then repeating it as if it were established.
  - Praise or hedging that carries no information.
  - Rhythm that never varies, or agreement that arrives too easily between the hosts.
  Do not treat these lists as complete. Tells change with each model generation; judge what you
  actually hear in this script, including tells no list here names.
  </what_counts>

  <what_does_not_count>
  - Technical vocabulary that a senior engineer would genuinely use.
  - Spelled-out numbers, dates and acronyms. The script is read by a speech synthesiser, so
    "seventy-two point six percent" and "L-L-M" are correct, not errors.
  - Disfluencies, ellipses, interruptions and sentence fragments. These are requested.
  - Strong opinions or disagreement between the hosts. The format asks for them.
  </what_does_not_count>

  <output>
  Return exactly one of `pass` or `fail`, and explain which specific passages drove the verdict,
  quoting them.
  </output>
