kind: evaluator
type: llm_eval
key: analytics-multi-turn-consistency
display_name: Analytics multi-turn consistency
description: >-
  Judges whether constraints, resolved references, corrections, and authorized state remain
  consistent across turns. This draft must be aligned against human labels before remote sync.
path: evaluators/jury
# Switch between a single judge and the jury by changing `mode` only; both the
# `model` and `judges` declarations below stay valid and reviewed either way.
mode: jury
model: tensorix/qwen/qwen3.8-flash-next
judges:
  - openai/gpt-5.6-luna
  - google-ai/gemini-3.5-flash-lite
  - tensorix/qwen/qwen3.8-flash-next
min_successful_judges: 2
repetitions: 1
output:
  type: categorical
  labels:
    - {value: pass, description: The response consistently applies prior conversational context.}
    - {value: fail, description: The response drops or contradicts material prior context.}
    - {value: not_applicable, description: The conversation has fewer than two user turns.}
  passing: [pass]
input_mapping:
  input.all_messages: full ordered conversation including the graded turn
  output.response: final assistant response
  output.tools_called: ordered tool calls and results
  state_transition: serialized local state before and after the graded turn
validation:
  status: pending_human_labels
  human_labeled_examples: 0
prompt: |
  You are an expert evaluator assessing a multi-turn business analytics chatbot.

  ## Your Task
  Determine whether the assistant consistently retains and applies material prior context.

  ## Evaluation Criterion: Multi-turn Consistency
  - **Fail**: The response drops or contradicts a material constraint, resolved reference,
    correction, metric choice, scope, or current-turn state authorization.
  - **Pass**: The response consistently applies all material prior context and corrections.
  - **Not applicable**: The conversation contains fewer than two user turns.

  ## Output Format
  Return a JSON object with exactly two keys: first "reasoning" with a brief explanation, then
  "answer" with exactly one of "pass", "fail", or "not_applicable". Return no other text.

  ## Now evaluate
  Conversation: {{input.all_messages}}
  Final response: {{output.response}}
  Tool evidence: {{output.tools_called}}
  State transition: {{state_transition}}
