kind: evaluator
type: llm_eval
key: analytics-answer-correctness
display_name: Analytics answer correctness
description: >-
  Judges whether the final analytics answer is correct relative to the oracle, without seeing
  execution evidence. This draft must be aligned against human labels before remote sync.
path: evaluators/jury
mode: single
model: openai/gpt-5.6-sol
repetitions: 1
output:
  type: categorical
  labels:
    - {value: pass, description: The answer is correct relative to the oracle.}
    - {value: fail, description: The answer conflicts with or omits a material oracle fact.}
    - {value: not_applicable, description: No usable oracle is present.}
  passing: [pass]
input_mapping:
  input.user_query: last user request
  input.all_messages: full ordered conversation
  input.expected_output: oracle expected answer only
  output.response: final assistant response
validation:
  status: pending_human_labels
  human_labeled_examples: 0
prompt: |
  You are an expert evaluator assessing a DuckDB-backed business analytics chatbot.

  ## Your Task
  Determine whether the final answer is factually correct relative to the supplied oracle.

  ## Evaluation Criterion: Answer Correctness
  - **Fail**: The response conflicts with the oracle, omits a material requested result, or makes
    an unsupported choice when the oracle makes the intended result unambiguous.
  - **Pass**: The response reports the material oracle facts correctly. Minor wording and rounding
    differences pass when they preserve the meaning.
  - **Not applicable**: The oracle is empty or does not address the requested answer.

  Do not infer correctness from tool execution. You intentionally cannot see tool calls here.

  ## Output Format
  Return a JSON object with exactly two keys: first "reasoning" with a brief explanation, then
  "answer" with exactly one of "pass", "fail", or "not_applicable". Return no other text.

  ## Now evaluate
  User request: {{input.user_query}}
  Conversation: {{input.all_messages}}
  Final response: {{output.response}}
  Oracle: {{input.expected_output}}
