kind: evaluator
type: llm_eval
key: analytics-answer-correctness
display_name: Analytics answer correctness
description: >-
  Judges whether the final analytics answer is correct, reference-free: the judge sees the full
  ordered conversation including tool calls and results, but no oracle. The oracle stays outside
  the judge so it can serve as ground truth when the judge is aligned against it.
path: evaluators/jury
# Switch between a single judge and the jury by changing `mode` only; both the
# `model` and `judges` declarations below stay valid and reviewed either way.
mode: single
model: wafer/DeepSeek-V4-Flash-0731-Fast
judges:
  - openai/gpt-5.6-luna
  - google-ai/gemini-3.5-flash-lite
  - tensorix/qwen/qwen3.8-flash-next
min_successful_judges: 2
repetitions: 1
output:
  type: categorical
  labels:
    - {value: pass, description: "The final answer is correct and consistent with the execution evidence."}
    - {value: fail, description: "The final answer is wrong, unsupported, or omits a material requested result."}
    - {value: not_applicable, description: "The conversation contains no answerable analytics request."}
  passing: [pass]
input_mapping:
  input.user_query: last user request
  input.all_messages: full ordered conversation including tool calls and results
  output.response: final assistant response
validation:
  status: shadow
  human_labeled_examples: 0
prompt: |
  You are an expert evaluator assessing a DuckDB-backed business analytics chatbot.

  <task>
  Determine whether the final answer is factually correct. You have no reference answer. Derive
  the correct result yourself from the user's request and the tool calls and tool results recorded
  in the conversation, then compare the final answer against it.
  </task>

  <criterion name="answer_correctness">
  - fail: The final answer conflicts with the recorded tool results, reports a figure or ranking
    the evidence does not support, applies the wrong definition (for example gross instead of net,
    wrong period, wrong grouping) when the user's request makes the intended one clear, or omits a
    material requested result.
  - pass: Every material figure, entity, and ranking in the final answer follows from the recorded
    tool results and matches what the user asked for. Minor wording, formatting, and rounding
    differences pass when they preserve the meaning.
  - not_applicable: The conversation contains no answerable analytics request, or the assistant
    correctly stopped to ask for a required clarification instead of answering.

  Judge the answer, not the process: an inefficient path that reaches the right figure passes; a
  clean path that reports a figure the evidence does not support fails.
  </criterion>

  <user_request>
  {{input.user_query}}
  </user_request>

  <conversation description="ordered, including tool calls and results">
  {{input.all_messages}}
  </conversation>

  <final_response>
  {{output.response}}
  </final_response>
