kind: evaluator
type: llm_eval
key: analytics-evidence-faithfulness
display_name: Analytics evidence faithfulness
description: >-
  Judges whether factual claims are entailed by tool and retrieval evidence without seeing the
  oracle or reference SQL. This draft must be aligned against human labels before remote sync.
path: evaluators/jury
# Switch between a single judge and the jury by changing `mode` only; both the
# `model` and `judges` declarations below stay valid and reviewed either way.
mode: jury
model: tensorix/qwen/qwen3.8-flash-next
judges:
  - openai/gpt-5.6-luna
  - google-ai/gemini-3.5-flash-lite
  - tensorix/qwen/qwen3.8-flash-next
min_successful_judges: 2
repetitions: 1
output:
  type: categorical
  labels:
    - {value: pass, description: Every material factual claim is entailed by execution evidence.}
    - {value: fail, description: A material claim is absent from or contradicts the evidence.}
    - {value: not_applicable, description: No tool or retrieval evidence is present.}
  passing: [pass]
input_mapping:
  input.user_query: last user request
  input.retrievals: retrieval evidence
  output.response: final assistant response
  output.tools_called: ordered tool calls and results
validation:
  status: pending_human_labels
  human_labeled_examples: 0
prompt: |
  You are an expert evaluator assessing a DuckDB-backed business analytics chatbot.

  ## Your Task
  Determine whether every material factual claim in the final response is entailed by the
  recorded execution or retrieval evidence.

  ## Evaluation Criterion: Evidence Faithfulness
  - **Fail**: A material factual claim contradicts the evidence or is not supported by it.
  - **Pass**: Every material factual claim is directly supported by the evidence; appropriate
    uncertainty also passes.
  - **Not applicable**: No tool result or retrieval evidence is available.

  Do not judge against an oracle. You intentionally cannot see expected answers or reference SQL.

  ## Output Format
  Return a JSON object with exactly two keys: first "reasoning" with a brief explanation, then
  "answer" with exactly one of "pass", "fail", or "not_applicable". Return no other text.

  ## Now evaluate
  User request: {{input.user_query}}
  Final response: {{output.response}}
  Tool evidence: {{output.tools_called}}
  Retrieval evidence: {{input.retrievals}}
