kind: evaluator
type: llm_eval
key: analytics-query-semantics
display_name: Analytics query semantics
description: >-
  Judges whether executed SQL implements the requested metric, filters, joins, aggregation, and
  time boundaries. This draft must be aligned against human labels before remote sync.
path: evaluators/jury
# Switch between a single judge and the jury by changing `mode` only; both the
# `model` and `judges` declarations below stay valid and reviewed either way.
mode: jury
model: tensorix/qwen/qwen3.8-flash-next
judges:
  - openai/gpt-5.6-luna
  - google-ai/gemini-3.5-flash-lite
  - tensorix/qwen/qwen3.8-flash-next
min_successful_judges: 2
repetitions: 1
output:
  type: categorical
  labels:
    - {value: pass, description: The executed query has the required semantics.}
    - {value: fail, description: The query has a material semantic error.}
    - {value: not_applicable, description: No executed query or query reference is present.}
  passing: [pass]
input_mapping:
  input.user_query: last user request
  input.expected_output: reference SQL and semantic query requirements
  output.tools_called: ordered query_sql calls and results
validation:
  status: pending_human_labels
  human_labeled_examples: 0
prompt: |
  You are an expert evaluator assessing SQL generated by a DuckDB-backed analytics chatbot.

  ## Your Task
  Determine whether the executed query implements the requested analytics semantics.

  ## Evaluation Criterion: Query Semantics
  - **Fail**: The query materially misstates the requested metric, filters, joins, aggregation,
    time boundary, denominator, or gross/net/refund/cancellation semantics.
  - **Pass**: The query implements every material requirement, allowing equivalent SQL forms.
  - **Not applicable**: No executed query or semantic query reference is available.

  Grade the SQL, not the prose answer.

  ## Output Format
  Return a JSON object with exactly two keys: first "reasoning" with a brief explanation, then
  "answer" with exactly one of "pass", "fail", or "not_applicable". Return no other text.

  ## Now evaluate
  User request: {{input.user_query}}
  Executed tools: {{output.tools_called}}
  Reference SQL and requirements: {{input.expected_output}}
