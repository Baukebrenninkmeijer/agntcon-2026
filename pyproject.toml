[project]
name = "analytics-chatbot"
version = "0.1.0"
description = "Observable analytics chatbot for the agent evaluation talk"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "evaluatorq==1.35.0",
    "httpx>=0.28",
    "openai>=2.8",
    "orq-ai-sdk>=4.14.7",
    "polars>=1.35",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.1",
    "pyyaml>=6.0.3",
    "rich>=14.2",
    "sqlglot>=27.28",
    "typer>=0.20",
]

[project.scripts]
analytics-chatbot = "analytics_chatbot.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.2",
    "pytest-mock>=3.15",
    "ruff>=0.14",
    "segno>=1.6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_chatbot"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["live: opt-in tests that call the orq AI Gateway"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
